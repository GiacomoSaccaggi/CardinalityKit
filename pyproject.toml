[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardinalitykit"
version = "1.0.2"
description = "A comprehensive toolkit for cardinality estimation algorithms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"
authors = [
    { name = "Giacomo Saccaggi", email = "giacomo.saccaggi@gmail.com" },
]
keywords = [
    "cardinality",
    "estimation",
    "hyperloglog",
    "hyperreal",
    "probabilistic",
    "counting",
    "privacy",
    "analytics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.19.0",
    "pandas>=1.1.0",
    "tqdm>=4.50.0",
    "scipy>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black>=21.0",
    "flake8>=3.8",
]

[project.urls]
Homepage = "https://giacomosaccaggi.github.io/CardinalityKit/"
Documentation = "https://giacomosaccaggi.github.io/CardinalityKit/"
Repository = "https://github.com/GiacomoSaccaggi/CardinalityKit"
Issues = "https://github.com/GiacomoSaccaggi/CardinalityKit/issues"

[tool.setuptools.packages.find]
include = ["cardinalitykit*"]
exclude = ["simulation*", "documentation*", "tests*"]
